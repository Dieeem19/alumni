<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCP Alumni System | Register Alumni Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<!-- Supabase JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
    vertical-align: middle;
    line-height: 1;
  }
</style>
</head>
<body>

<div class="auth-page" style="padding: 40px 16px;">
  <div class="auth-card" style="max-width: 520px;">
    <img class="auth-logo-img" src="assets/img/bcplogo.png" alt="Bestlink College of the Philippines logo">

    <div class="auth-panel">
      <h1 class="auth-title" style="margin-bottom: 4px;">Alumni Registration</h1>
      <p class="auth-subtitle" style="margin-bottom: 16px;">Create your alumni account</p>

      <div id="alertBox" style="display: none; padding: 12px 16px; border-radius: var(--radius-sm); font-size: 13.5px; margin-bottom: 18px; text-align: left;"></div>

      <form id="registerForm" onsubmit="handleRegister(event)">

        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
          <div class="form-group" style="flex: 1.1; min-width: 130px;">
            <label class="form-label" for="regLastName">Last Name *</label>
            <input class="form-control" type="text" id="regLastName" placeholder="e.g. Santos" required>
          </div>
          <div class="form-group" style="flex: 1.1; min-width: 130px;">
            <label class="form-label" for="regFirstName">First Name *</label>
            <input class="form-control" type="text" id="regFirstName" placeholder="e.g. Maria Clara" required>
          </div>
          <div class="form-group" style="flex: 0.9; min-width: 110px;">
            <label class="form-label" for="regMiddleName">Middle Name</label>
            <input class="form-control" type="text" id="regMiddleName" placeholder="e.g. Reyes">
          </div>
        </div>

        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
          <div class="form-group" style="flex: 2; min-width: 200px;">
            <label class="form-label" for="regCourse">Course / Degree Graduated *</label>
            <select class="form-control" id="regCourse" required>
              <option value="" disabled selected>Select Course / Degree</option>
              <option value="BS Information Technology">BS Information Technology</option>
              <option value="BS Tourism">BS Tourism</option>
              <option value="BS Hospitality Management">BS Hospitality Management</option>
              <option value="BS Computer Science">BS Computer Science</option>
              <option value="BS Business Administration">BS Business Administration</option>
              <option value="BS Criminology">BS Criminology</option>
              <option value="BS Accountancy">BS Accountancy</option>
              <option value="BS Education">BS Education</option>
              <option value="Other">Other / Not Listed</option>
            </select>
          </div>
          <div class="form-group" style="flex: 1; min-width: 100px;">
            <label class="form-label" for="regBatch">Batch Year *</label>
            <input class="form-control" type="text" id="regBatch" placeholder="e.g. 2023" required>
          </div>
        </div>

        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
          <div class="form-group" style="flex: 1; min-width: 150px;">
            <label class="form-label" for="regStatus">Employment Status *</label>
            <select class="form-control" id="regStatus" required onchange="handleStatusChange('regStatus', 'regCompany')">
              <option value="Employed">Employed</option>
              <option value="Unemployed">Unemployed</option>
              <option value="Freelance">Freelance</option>
              <option value="Seeking">Job Seeking</option>
              <option value="Studying">Further Studies</option>
            </select>
          </div>
          <div class="form-group" style="flex: 1.5; min-width: 180px;">
            <label class="form-label" for="regCompany">Current Company / Employer</label>
            <input class="form-control" type="text" id="regCompany" placeholder="e.g. Accenture PH or Self-Employed">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">Email Address (Gmail) *</label>
          <input class="form-control" type="email" id="regEmail" placeholder="e.g. maria.clara@gmail.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="newPassword">Password *</label>
          <input class="form-control" type="password" id="newPassword" placeholder="Minimum 6 characters" required minlength="6">
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmNewPassword">Confirm Password *</label>
          <input class="form-control" type="password" id="confirmNewPassword" placeholder="Re-enter password" required minlength="6">
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="registerBtn" style="margin-top: 10px; padding: 12px;">
          <span class="material-symbols-outlined" style="font-size:18px">school</span> Complete Alumni Registration
        </button>
      </form>

      <p class="auth-links" style="margin-top: 22px;">
        Already registered? <a href="login.html">Sign in here</a>
      </p>
    </div>

  </div>
</div>

<script>
  // ── Supabase ──────────────────────────────────────────────────────────────
  const SUPABASE_URL = 'https://agzctzbsmjbstoiyenrf.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_9mDQ1g-Ue60AXuD5UeipoA_ol5eyCPD';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ── Helpers ───────────────────────────────────────────────────────────────
  function showAlert(elemId, msg, isSuccess = false) {
    const box = document.getElementById(elemId);
    box.style.display = 'block';
    box.style.background = isSuccess ? '#dcfce7' : '#fee2e2';
    box.style.color      = isSuccess ? '#15803d' : '#b91c1c';
    box.style.border     = isSuccess ? '1px solid #86efac' : '1px solid #fca5a5';
    box.innerHTML = msg;
  }

  function handleStatusChange(statusId, companyId) {
    const s = document.getElementById(statusId);
    const c = document.getElementById(companyId);
    if (!s || !c) return;
    if (s.value === 'Unemployed') {
      c.value = 'N/A';
    } else if (c.value === 'N/A' || c.value === 'NA') {
      c.value = '';
    }
  }

  function escapeHtml(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ── Registration ──────────────────────────────────────────────────────────
  async function handleRegister(e) {
    e.preventDefault();

    const lastName   = document.getElementById('regLastName').value.trim();
    const firstName  = document.getElementById('regFirstName').value.trim();
    const middleName = (document.getElementById('regMiddleName').value || '').trim();
    const fullName   = middleName ? `${lastName}, ${firstName} ${middleName}` : `${lastName}, ${firstName}`;

    const email   = document.getElementById('regEmail').value.trim();
    const pwd     = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmNewPassword').value;

    if (pwd.length < 6) {
      showAlert('alertBox', '<span class="material-symbols-outlined" style="font-size:16px">warning</span> Password must be at least 6 characters.');
      return;
    }
    if (pwd !== confirm) {
      showAlert('alertBox', '<span class="material-symbols-outlined" style="font-size:16px">warning</span> Passwords do not match. Please re-enter.');
      return;
    }

    const userStatus = document.getElementById('regStatus').value;
    const alumniData = {
      name:        fullName,
      course:      document.getElementById('regCourse').value,
      batch:       document.getElementById('regBatch').value.trim(),
      status:      userStatus,
      employment:  userStatus,
      company:     document.getElementById('regCompany').value.trim() || '—',
      email:       email,
      location:    'Metro Manila',
      position:    userStatus === 'Unemployed' ? 'N/A' : 'Staff / Specialist',
      active:      true
    };

    const btn = document.getElementById('registerBtn');
    btn.disabled = true;
    btn.textContent = 'Creating Alumni Profile...';

    try {
      // 1. Authoritative Supabase Auth signUp
      const { data: authData, error: authError } = await db.auth.signUp({
        email,
        password: pwd,
        options: {
          data: {
            full_name: fullName,
            role: 'alumni',
            course: alumniData.course,
            batch: alumniData.batch,
            status: userStatus,
            company: alumniData.company
          }
        }
      });

      if (authError) {
        let msg = authError.message;
        if (msg.toLowerCase().includes('already registered') || msg.toLowerCase().includes('user already exists')) {
          msg = 'An account with this email already exists. Please sign in instead.';
        }
        showAlert('alertBox', `<span class="material-symbols-outlined" style="font-size:16px">error</span> <strong>Registration Failed:</strong> ${escapeHtml(msg)}`);
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:18px">school</span> Complete Alumni Registration';
        return;
      }

      // 2. Insert alumni profile row in Supabase database
      try {
        const { error: dbError } = await db.from('alumni').upsert(alumniData, { onConflict: 'email' });
        if (dbError) {
          await db.from('alumni').insert([alumniData]);
        }
      } catch (insertErr) {
        console.warn('Alumni cloud insert notice:', insertErr);
      }

      // 3. Cache non-sensitive profile info for instant access
      try {
        const localUsers = JSON.parse(localStorage.getItem('bcp_registered_users') || '{}');
        localUsers[email.toLowerCase()] = {
          name: fullName,
          course: alumniData.course,
          batch: alumniData.batch,
          status: userStatus,
          employment: userStatus,
          company: alumniData.company,
          email: email,
          phone: '',
          location: 'Metro Manila',
          position: alumniData.position,
          skills: '',
          active: true
        };
        localStorage.setItem('bcp_registered_users', JSON.stringify(localUsers));

        const allAlumni = JSON.parse(localStorage.getItem('bcp_alumni_records') || '[]');
        const existingIdx = allAlumni.findIndex(a => a.email && a.email.toLowerCase() === email.toLowerCase());
        const newRec = {
          id: allAlumni.length > 0 ? Math.max(...allAlumni.map(a => Number(a.id) || 0)) + 1 : 1,
          name: fullName,
          course: alumniData.course,
          batch: alumniData.batch,
          status: userStatus,
          employment: userStatus,
          company: alumniData.company,
          position: alumniData.position,
          location: 'Metro Manila',
          email: email,
          active: true
        };
        if (existingIdx >= 0) {
          allAlumni[existingIdx] = { ...allAlumni[existingIdx], ...newRec };
        } else {
          allAlumni.unshift(newRec);
        }
        localStorage.setItem('bcp_alumni_records', JSON.stringify(allAlumni));
      } catch (storageErr) {
        console.warn('LocalStorage cache note:', storageErr);
      }

      // Cache session for seamless pre-fill on login
      sessionStorage.setItem('bcp_admin_name', fullName);
      sessionStorage.setItem('bcp_user_email', email);
      sessionStorage.setItem('bcp_user_batch', alumniData.batch);
      sessionStorage.setItem('bcp_user_course', alumniData.course);
      sessionStorage.setItem('bcp_user_status', alumniData.status);
      sessionStorage.setItem('bcp_user_company', alumniData.company);

      const successNotice = authData?.user && authData?.session === null && !authData?.user?.confirmed_at
        ? '<span class="material-symbols-outlined" style="font-size:18px">celebration</span> <strong>Account Created!</strong> If email confirmation is required, please verify your inbox before signing in.<br><a href="login.html" style="font-weight:600; text-decoration:underline;">Click here to Sign In</a>'
        : '<span class="material-symbols-outlined" style="font-size:18px">celebration</span> <strong>Registration Successful!</strong> Your alumni account is created.<br><a href="login.html" style="font-weight:600; text-decoration:underline;">Click here to Sign In</a>';

      showAlert('alertBox', successNotice, true);
      setTimeout(() => {
        document.getElementById('registerForm').reset();
        window.location.href = 'login.html';
      }, 1500);

    } catch (err) {
      console.error('Registration remote error:', err);
      showAlert('alertBox', `<span class="material-symbols-outlined" style="font-size:16px">error</span> <strong>Registration Failed:</strong> ${escapeHtml(err.message || 'An unexpected error occurred during cloud registration.')}`);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:18px">school</span> Complete Alumni Registration';
    }
  }
</script>
</body>
</html>
